name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  FACTORY_SLOT: '0'

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.5.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test:unit

      - name: API contract drift
        run: pnpm api:check

      - name: Start Supabase + reset DB (migrations + seed)
        run: pnpm env:reset

      - name: Database tests (pgTAP)
        run: pnpm test:db

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Build
        run: pnpm build

      - name: E2E baseline
        run: pnpm e2e:baseline

      - name: Design check
        run: pnpm design:check

      - name: Stop Supabase
        if: always()
        run: pnpm env:down
